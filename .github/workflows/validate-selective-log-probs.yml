name: Validate stable selective log probabilities
on:
  push:
    branches: [validation/selective-log-probability-stability-20261113]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      DS_BUILD_OPS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install setuptools wheel packaging
          python -m pip install --no-build-isolation torch==2.9.1 deepspeed==0.19.6 transformers==5.15.0 pylatexenc sympy datasets pytest==9.0.2 aiohttp httpx black==26.5.1 isort==9.0.0a3 autoflake==2.3.3
          python -m pip freeze > installed-dependencies.txt
      - name: Compare exact original and repaired native behavior
        run: python contribution-validation/run_log_probs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selective-log-probability-native-before-after
          path: |
            *.log
            *.xml
            *benchmark.json
            installed-dependencies.txt
            validation-result.json
