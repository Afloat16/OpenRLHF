name: Validate batched length penalties
on:
  push:
    branches: [validation/batched-length-penalties-20261113]
permissions:
  contents: read
jobs:
  native-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native CPU dependencies
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch==2.9.1 transformers==4.57.1 pylatexenc sympy pytest==9.0.2 aiohttp httpx black==26.5.1 isort==9.0.0a3 autoflake==2.3.3
          python -m pip freeze > installed-dependencies.txt
          git diff --exit-code 19f63df4b4e921030a259696477ecc4d64e449b0 -- openrlhf tests
      - name: Verify original semantic controls and per-sample scalar extraction
        run: |
          git checkout 26494490bc237f6c3af62dab6117e6bbb0a78dba -- openrlhf/trainer/ppo_utils/length_penalty.py
          python - <<'PY'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          with open("baseline.log", "w") as log:
              result = subprocess.run([sys.executable, "-m", "pytest", "-q", "tests/test_length_penalty_batches.py", "--junitxml=baseline.xml"], stdout=log, stderr=subprocess.STDOUT, check=False)
          print(open("baseline.log").read(), flush=True)
          totals = {name: sum(int(s.get(name, 0)) for s in ET.parse("baseline.xml").getroot().iter("testsuite")) for name in ("tests", "failures", "errors", "skipped")}
          print("Exact-base totals:", totals, flush=True)
          assert result.returncode == 1 and totals == {"tests": 50, "failures": 2, "errors": 0, "skipped": 0}, totals
          PY
          python contribution-validation/benchmark_length_penalties.py > baseline-benchmark.json
          cat baseline-benchmark.json
      - name: Verify native penalties and language-model training
        if: always()
        run: |
          git checkout 19f63df4b4e921030a259696477ecc4d64e449b0 -- openrlhf/trainer/ppo_utils/length_penalty.py
          git diff --exit-code 19f63df4b4e921030a259696477ecc4d64e449b0 -- openrlhf tests
          set +e
          python -m pytest -q tests/test_length_penalty_batches.py --junitxml=patched.xml > patched.log 2>&1
          status=$?
          set -e
          cat patched.log
          test "$status" -eq 0
          set +e
          python -m pytest -q tests/test_agent.py -k test_multiturn_truncation_reaches_reward_penalty --junitxml=existing.xml > existing.log 2>&1
          status=$?
          set -e
          cat existing.log
          test "$status" -eq 0
          python contribution-validation/benchmark_length_penalties.py > patched-benchmark.json
          cat patched-benchmark.json
          python - <<'PY'
          import json
          baseline = json.load(open("baseline-benchmark.json"))
          patched = json.load(open("patched-benchmark.json"))
          for before, after in zip(baseline["rows"], patched["rows"]):
              assert before["batch_size"] == after["batch_size"]
              assert before["reward_sha256"] == after["reward_sha256"]
              assert before["penalized_count"] == after["penalized_count"]
              assert before["truncated_count"] == after["truncated_count"]
              print({"batch_size": before["batch_size"], "speedup": before["median_seconds"] / after["median_seconds"]})
          PY
      - name: Check project Python style
        if: always()
        run: |
          python -m isort --check-only --diff openrlhf/trainer/ppo_utils/length_penalty.py tests/test_length_penalty_batches.py contribution-validation/benchmark_length_penalties.py
          python -m black --check --diff openrlhf/trainer/ppo_utils/length_penalty.py tests/test_length_penalty_batches.py contribution-validation/benchmark_length_penalties.py
          python -m autoflake --check-diff --remove-all-unused-imports openrlhf/trainer/ppo_utils/length_penalty.py tests/test_length_penalty_batches.py contribution-validation/benchmark_length_penalties.py
          git diff --exit-code 19f63df4b4e921030a259696477ecc4d64e449b0 -- openrlhf tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: length-penalties-native-before-after
          path: |
            *.log
            *.xml
            *benchmark.json
            installed-dependencies.txt
