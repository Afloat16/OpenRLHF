name: Validate independent OpenRLHF project hooks
on:
  push:
    branches: [validation/openrlhf-final-project-hooks-20261113]
permissions:
  contents: read
jobs:
  project-hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3378c344009614dc0d8f49c2f0642abee96bb4bf
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project hooks
        run: |
          python -m pip install pre-commit
          pre-commit install
      - name: Check selective log probabilities
        run: |
          pre-commit run --files openrlhf/models/utils.py tests/test_selective_log_probs_stability.py
          git diff --exit-code
      - name: Check zero-width padding
        run: |
          git checkout --detach 3737390e06bb85a36f050358f4813807a12e4713
          pre-commit run --files openrlhf/utils/utils.py tests/test_zero_pad_sequence_allocations.py
          git diff --exit-code
